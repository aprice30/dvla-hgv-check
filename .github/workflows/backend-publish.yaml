name: Docker Publish - Backend API

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'   # only trigger on changes under this folder

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend
  MAJOR: 0
  MINOR: 0

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r backend/requirements.txt

      - name: Lint check with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run syntax compile check
        run: |
          python -m py_compile backend/*.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: vars
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SANITIZED_BRANCH="${BRANCH_NAME//\//-}"
          SHORT_SHA=${GITHUB_SHA::7}
          PATCH=${GITHUB_RUN_NUMBER}

          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          if [ "$SANITIZED_BRANCH" = "main" ]; then
            echo -e "${REGISTRY}/${IMAGE_NAME}:latest\n${REGISTRY}/${IMAGE_NAME}:${VERSION}\n${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}" > tags.txt
          else
            echo -e "${REGISTRY}/${IMAGE_NAME}:${SANITIZED_BRANCH}-latest\n${REGISTRY}/${IMAGE_NAME}:${SANITIZED_BRANCH}-${VERSION}\n${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}" > tags.txt
          fi

          echo "IMAGE_TAGS<<EOF" >> $GITHUB_ENV
          cat tags.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune dangling images
        run: docker image prune -f

  prune-packages:
    uses: ./.github/workflows/cleanup-packages.yaml
    needs: test-and-build
    permissions:
      contents: read
      packages: write
    with:
      package-name: backend
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
